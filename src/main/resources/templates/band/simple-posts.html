<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>밴드 글 목록 (단순 버전)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container py-4">
    <h1 class="mb-4">밴드 글 목록 (단순 버전)</h1>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div th:if="${posts == null}">
        <p class="alert alert-warning">글 목록을 불러올 수 없습니다.</p>
    </div>

    <div th:if="${posts != null}">
        <p th:text="${'밴드 키: ' + bandKey}"></p>

        <div th:if="${#lists.isEmpty(posts)}" class="alert alert-info">
            등록된 글이 없습니다.
        </div>

        <div th:if="${!#lists.isEmpty(posts)}">
            <p th:text="${'총 ' + #lists.size(posts) + '개의 글이 있습니다.'}"></p>

            <ul class="list-group mb-4">
                <li th:each="post : ${posts}" class="list-group-item">
                    <p th:if="${post.content != null}" th:text="${post.content}">글 내용</p>
                    <p th:if="${post.content == null}">내용 없음</p>

                    <!-- 댓글 정보 및 링크 추가 -->
                    <div class="mt-2">
                        <span class="badge bg-secondary" th:if="${post.comment_count != null && post.comment_count > 0}">
                            댓글 <span th:text="${post.comment_count}">0</span>개
                        </span>

                        <a th:if="${post.comment_count != null && post.comment_count > 0}"
                           th:href="@{/band/comments/list(band_key=${bandKey}, post_key=${post.post_key})}"
                           class="btn btn-sm btn-outline-primary ms-2">
                            댓글 보기
                        </a>
                    </div>
                </li>
            </ul>
        </div>

        <!-- 페이징 처리 -->
        <div th:if="${paging != null && paging.next_params != null}" class="pagination-container mb-4">
            <a th:href="@{/band/posts(band_key=${bandKey}, after=${paging.next_params.after})}"
               class="btn btn-primary">
                다음 페이지
            </a>
        </div>

        <a th:href="@{/band/list}" class="btn btn-secondary">밴드 목록으로</a>
    </div>
</div>
</body>
</html>
