<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>밴드 글 목록</title>
    <style>
        .post-item {
            margin-bottom: 1.5rem;
            border-radius: 0.5rem;
            border: 1px solid #eee;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .post-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .post-header {
            padding: 1rem;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            background-color: #f8f9fa;
        }
        .post-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 1rem;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .post-author {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        .post-time {
            font-size: 0.85rem;
            color: #6c757d;
        }
        .post-content {
            padding: 1.5rem;
            white-space: pre-line;
        }
        .post-photos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 0.5rem;
            padding: 0 1.5rem 1.5rem;
        }
        .post-photo {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 0.3rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .post-photo:hover {
            opacity: 0.9;
        }
        .post-stats {
            display: flex;
            padding: 0.75rem 1.5rem;
            border-top: 1px solid #eee;
            color: #6c757d;
            font-size: 0.9rem;
            background-color: #f8f9fa;
        }
        .post-stat {
            margin-right: 1.5rem;
            display: flex;
            align-items: center;
        }
        .post-stat i {
            margin-right: 0.35rem;
        }
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            border-radius: 0.5rem;
            background-color: #f8f9fa;
            border: 1px dashed #dee2e6;
            margin: 2rem 0;
        }
        .empty-state i {
            font-size: 3rem;
            color: #adb5bd;
            margin-bottom: 1rem;
        }
        .band-info {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
            padding: 1rem;
            border-radius: 0.5rem;
            background-color: #f8f9fa;
            border: 1px solid #eee;
        }
        .band-logo {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 1rem;
            border: 3px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .band-name {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 0.25rem;
        }
        .band-stats {
            color: #6c757d;
        }
        .filter-bar {
            padding: 1rem;
            background-color: #f8f9fa;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .filter-options {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .order-tag {
            display: inline-block;
            padding: 0.35rem 0.75rem;
            background-color: #e7f5ff;
            color: #0d6efd;
            border-radius: 2rem;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            margin-right: 0.5rem;
        }
        #postAnalytics {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }
        #postAnalytics.show {
            max-height: 500px;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <!-- 밴드 정보 헤더 (상단에 고정) -->
    <div class="band-info">
        <img src="/img/default-band.png" class="band-logo" alt="밴드 로고">
        <div>
            <h2 class="band-name">밴드 이름</h2>
            <div class="band-stats">
                <span><i class="bi bi-people"></i> 멤버 <span>0</span>명</span>
                <span class="ms-3"><i class="bi bi-card-text"></i> 글 <span>0</span>개</span>
            </div>
        </div>
    </div>

    <!-- 필터 및 검색 바 -->
    <div class="filter-bar">
        <div class="filter-options">
            <select class="form-select form-select-sm" aria-label="정렬 기준">
                <option selected>최신순</option>
                <option>오래된순</option>
                <option>댓글 많은순</option>
                <option>공감 많은순</option>
            </select>
            <select class="form-select form-select-sm" aria-label="글 종류">
                <option selected>모든 글</option>
                <option>주문 있는 글</option>
                <option>사진 있는 글</option>
            </select>
            <button class="btn btn-sm btn-outline-primary" type="button" data-bs-toggle="collapse" data-bs-target="#postAnalytics">
                <i class="bi bi-bar-chart"></i> 분석
            </button>
        </div>
        <div class="search-box">
            <div class="input-group input-group-sm">
                <input type="text" class="form-control" placeholder="글 검색..." aria-label="글 검색">
                <button class="btn btn-outline-secondary" type="button">
                    <i class="bi bi-search"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 글 분석 패널 (기본적으로 접힌 상태) -->
    <div id="postAnalytics" class="card mb-4 collapse">
        <div class="card-body">
            <h5 class="card-title">글 분석</h5>
            <div class="row g-3">
                <div class="col-md-4">
                    <div class="card border-0 bg-light">
                        <div class="card-body text-center">
                            <h6 class="mb-2">총 글</h6>
                            <h2 class="mb-0">0</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card border-0 bg-light">
                        <div class="card-body text-center">
                            <h6 class="mb-2">총 댓글</h6>
                            <h2 class="mb-0">0</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card border-0 bg-light">
                        <div class="card-body text-center">
                            <h6 class="mb-2">주문 수</h6>
                            <h2 class="mb-0">0</h2>
                        </div>
                    </div>
                </div>
            </div>
            <!-- 추가 분석 차트나 그래프를 여기에 표시할 수 있습니다 -->
        </div>
    </div>

    <!-- 알림 메시지 -->
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${message}">성공 메시지</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- 에러 메시지 -->
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${error}">에러 메시지</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- 빈 상태 표시 -->
    <div th:if="${posts == null || #lists.isEmpty(posts)}" class="empty-state">
        <i class="bi bi-card-text"></i>
        <h4>게시글이 없습니다</h4>
        <p class="text-muted">이 밴드에는 아직 게시글이 없습니다.</p>
    </div>

    <!-- 게시글 목록 -->
    <div th:if="${posts != null && !#lists.isEmpty(posts)}">
        <!-- 각 게시글 아이템 -->
        <div th:each="post : ${posts}" class="post-item">
            <!-- 게시글 헤더 -->
            <div class="post-header">
                <img th:if="${post.author != null && post.author.profile_image_url != null}"
                     th:src="${post.author.profile_image_url}"
                     class="post-avatar"
                     alt="프로필 이미지">
                <img th:unless="${post.author != null && post.author.profile_image_url != null}"
                     src="/img/default-profile.png"
                     class="post-avatar"
                     alt="기본 프로필">
                <div>
                    <div class="post-author" th:text="${post.author != null ? post.author.name : '알 수 없음'}">
                        작성자 이름
                    </div>
                    <div class="post-time" th:if="${post.created_at != null}">
                        <i class="bi bi-clock"></i>
                        <span th:text="${#dates.format(new java.util.Date(post.created_at), 'yyyy년 MM월 dd일 HH:mm')}">
                                작성 시간
                            </span>
                    </div>
                </div>
            </div>

            <!-- 게시글 내용 -->
            <div class="post-content">
                <p th:text="${post.content != null ? post.content : '내용 없음'}" class="mb-0">
                    게시글 내용입니다...
                </p>

                <!-- 주문 태그 표시 (실제 구현 시 주문이 있는 경우 표시) -->
                <div class="mt-2" th:if="${post.content != null && #strings.contains(post.content, '주문')}">
                        <span class="order-tag">
                            <i class="bi bi-cart"></i> 주문 있음
                        </span>
                </div>
            </div>

            <!-- 게시글 사진 -->
            <div th:if="${post.photos != null && !#lists.isEmpty(post.photos)}" class="post-photos">
                <img th:each="photo : ${post.photos}"
                     th:if="${photo != null && photo.url != null}"
                     th:src="${photo.url}"
                     class="post-photo"
                     alt="게시글 이미지"
                     data-bs-toggle="modal"
                     data-bs-target="#imageModal">
            </div>

            <!-- 게시글 통계 -->
            <div class="post-stats">
                <div class="post-stat" th:classappend="${post.comment_count != null && post.comment_count > 0 ? 'text-primary' : ''}">
                    <i class="bi bi-chat-left"></i>
                    <span th:text="${post.comment_count != null ? post.comment_count : 0}">0</span>
                    <span class="ms-1">댓글</span>
                </div>
                <div class="post-stat" th:classappend="${post.emotion_count != null && post.emotion_count > 0 ? 'text-danger' : ''}">
                    <i class="bi bi-heart"></i>
                    <span th:text="${post.emotion_count != null ? post.emotion_count : 0}">0</span>
                    <span class="ms-1">공감</span>
                </div>

                <!-- 댓글 보기 링크 -->
                <div class="ms-auto">
                    <a th:if="${post.comment_count != null && post.comment_count > 0}"
                       th:href="@{/band/comments/list(band_key=${bandKey}, post_key=${post.post_key})}"
                       class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-chat-text"></i> 댓글 보기
                    </a>
                </div>
            </div>
        </div>

        <!-- 페이지네이션 -->
        <div th:if="${paging != null && paging.next_params != null}" class="d-flex justify-content-center mt-4">
            <a th:href="@{/band/posts(band_key=${bandKey}, after=${paging.next_params.after})}"
               class="btn btn-primary">
                <i class="bi bi-chevron-down"></i> 더 보기
            </a>
        </div>
    </div>

    <!-- 하단 액션 버튼 -->
    <div class="d-flex justify-content-between mt-4">
        <a th:href="@{/band/list}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> 밴드 목록으로
        </a>
        <button type="button" class="btn btn-outline-primary" onclick="refreshPosts()">
            <i class="bi bi-arrow-clockwise"></i> 새로고침
        </button>
    </div>

    <!-- 이미지 모달 -->
    <div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="imageModalLabel">이미지 보기</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="modalImage" src="" class="img-fluid" alt="확대 이미지">
                </div>
            </div>
        </div>
    </div>

    <!-- 스크롤 상단 버튼 -->
    <button id="backToTop" class="btn btn-primary btn-sm position-fixed bottom-0 end-0 m-4" style="display: none;">
        <i class="bi bi-arrow-up"></i>
    </button>
</div>

<!-- 페이지별 스크립트 -->
<th:block layout:fragment="script">
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 스크롤 상단 버튼 표시/숨김 처리
            const backToTopBtn = document.getElementById('backToTop');

            window.addEventListener('scroll', function() {
                if (window.scrollY > 300) {
                    backToTopBtn.style.display = 'block';
                } else {
                    backToTopBtn.style.display = 'none';
                }
            });

            backToTopBtn.addEventListener('click', function() {
                window.scrollTo({top: 0, behavior: 'smooth'});
            });

            // 이미지 모달 설정
            const postPhotos = document.querySelectorAll('.post-photo');
            const modalImage = document.getElementById('modalImage');

            postPhotos.forEach(function(photo) {
                photo.addEventListener('click', function() {
                    modalImage.src = this.src;
                });
            });

            // 밴드 정보 설정 (실제 구현에서는 서버에서 받은 데이터 사용)
            const bandLogo = document.querySelector('.band-logo');
            const bandName = document.querySelector('.band-name');
            const bandStats = document.querySelector('.band-stats').querySelectorAll('span');

            // 여기에 실제 밴드 정보를 설정하는 코드를 추가할 수 있습니다
        });

        // 새로고침 함수
        function refreshPosts() {
            location.reload();
        }
    </script>
</th:block>
</body>
</html>
