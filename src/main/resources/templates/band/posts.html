<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>밴드 글 목록</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .posts-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .post-item {
            margin-bottom: 30px;
            border: 1px solid #eee;
            border-radius: 8px;
            overflow: hidden;
        }
        .post-header {
            padding: 15px;
            background-color: #f8f9fa;
            border-bottom: 1px solid #eee;
        }
        .post-content {
            padding: 20px;
        }
        .post-footer {
            padding: 10px 15px;
            background-color: #f8f9fa;
            font-size: 14px;
            color: #6c757d;
        }
        .post-photos {
            display: flex;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        .post-photo {
            width: 150px;
            height: 150px;
            margin-right: 10px;
            margin-bottom: 10px;
            object-fit: cover;
            border-radius: 4px;
        }
        .profile-image {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 10px;
        }
        .author-info {
            display: flex;
            align-items: center;
        }
        .author-name {
            font-weight: bold;
            margin-bottom: 0;
        }
        .post-time {
            font-size: 12px;
            color: #6c757d;
        }
        .comments-section {
            padding: 10px 15px;
            background-color: #f8f9fa;
            border-top: 1px solid #eee;
        }
        .comment-item {
            margin: 10px 0;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .comment-item:last-child {
            border-bottom: none;
        }
        .pagination-container {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container posts-container">
    <h1 class="text-center mb-4">밴드 글 목록</h1>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- 글 목록 -->
    <div th:if="${posts != null}">
        <div th:if="${#lists.isEmpty(posts)}" class="text-center">
            <div class="alert alert-info">등록된 글이 없습니다.</div>
        </div>

        <!-- 각 글 항목 -->
        <div th:each="post : ${posts}" class="post-item">
            <!-- 글 헤더 (작성자 정보) -->
            <div class="post-header">
                <div class="author-info" th:if="${post.author != null}">
                    <img th:if="${post.author.profile_image_url != null}"
                         th:src="${post.author.profile_image_url}"
                         class="profile-image"
                         alt="프로필 이미지">
                    <div>
                        <p class="author-name" th:text="${post.author.name != null ? post.author.name : '알 수 없음'}">작성자 이름</p>
                        <p class="post-time" th:if="${post.created_at != null}">
                            <span th:text="${#dates.format(new java.util.Date(post.created_at), 'yyyy-MM-dd HH:mm')}">작성 시간</span>
                        </p>
                    </div>
                </div>
            </div>

            <!-- 글 내용 -->
            <div class="post-content">
                <p th:if="${post.content != null}" th:text="${post.content}">글 내용</p>
                <p th:unless="${post.content != null}" class="text-muted">내용 없음</p>

                <!-- 사진/동영상 -->
                <div th:if="${post.photos != null && !#lists.isEmpty(post.photos)}" class="post-photos">
                    <div th:each="photo : ${post.photos}">
                        <img th:if="${photo != null && photo.url != null}"
                             th:src="${photo.url}"
                             class="post-photo"
                             alt="이미지">
                    </div>
                </div>
            </div>

            <!-- 글 푸터 (댓글 수, 공감 수) -->
            <div class="post-footer">
                    <span>
                        <i class="bi bi-chat"></i>
                        댓글 <span th:text="${post.comment_count != null ? post.comment_count : 0}">0</span>개
                    </span>
                <span class="ms-3" th:if="${post.emotion_count != null && post.emotion_count > 0}">
                        <i class="bi bi-heart"></i>
                        공감 <span th:text="${post.emotion_count}">0</span>개
                    </span>
            </div>

            <!-- 최근 댓글 섹션 -->
            <div th:if="${post.latest_comments != null && !#lists.isEmpty(post.latest_comments)}" class="comments-section">
                <h6>최근 댓글</h6>
                <div th:each="comment : ${post.latest_comments}" class="comment-item" th:if="${comment != null}">
                    <div class="d-flex" th:if="${comment.author != null}">
                        <div>
                            <strong th:text="${comment.author.name != null ? comment.author.name : '알 수 없음'}">댓글 작성자</strong>
                            <small class="text-muted ms-2" th:if="${comment.created_at != null}">
                                <span th:text="${#dates.format(new java.util.Date(comment.created_at), 'yyyy-MM-dd HH:mm')}">댓글 작성 시간</span>
                            </small>
                        </div>
                    </div>
                    <p class="mb-0 mt-1" th:text="${comment.body != null ? comment.body : ''}">댓글 내용</p>
                </div>
            </div>
        </div>

        <!-- 페이징 처리 -->
        <div th:if="${paging != null && paging.next_params != null}" class="pagination-container">
            <a th:href="@{/band/posts(band_key=${bandKey}, after=${paging.next_params.after})}"
               class="btn btn-primary">
                다음 페이지
            </a>
        </div>
    </div>

    <!-- 버튼 -->
    <div class="text-center mt-4">
        <a th:href="@{/band/list}" class="btn btn-secondary">밴드 목록으로</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
