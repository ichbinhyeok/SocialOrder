<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="ko"
      class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 기본 타이틀 (페이지별로 오버라이드 가능) -->
    <title layout:title-pattern="$LAYOUT_TITLE | $CONTENT_TITLE">소셜오더</title>

    <!-- 공통 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <!-- 페이지별 추가 CSS -->
    <th:block layout:fragment="css"></th:block>
</head>
<body class="d-flex flex-column h-100">
<!-- 헤더 -->
<th:block th:replace="fragments/header :: header"></th:block>

<!-- 알림 메시지 표시 영역 -->
<div class="container mt-3" th:if="${message != null}">
    <div class="alert" th:classappend="${messageType != null ? 'alert-' + messageType : 'alert-info'}" role="alert">
        <span th:text="${message}">알림 메시지</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

<!-- 에러 메시지 표시 영역 -->
<div class="container mt-3" th:if="${error != null}">
    <div class="alert alert-danger" role="alert">
        <span th:text="${error}">에러 메시지</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

<!-- 메인 컨텐츠 영역 -->
<main class="flex-shrink-0 py-4">
    <div class="container">
        <div layout:fragment="content">
            <!-- 페이지별 컨텐츠 -->
        </div>
    </div>
</main>

<!-- 푸터 -->
<th:block th:replace="fragments/footer :: footer"></th:block>

<!-- 공통 JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>

<!-- 페이지별 추가 JavaScript -->
<th:block layout:fragment="script"></th:block>
</body>
</html>
