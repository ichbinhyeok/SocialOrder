<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>밴드 사용자 프로필</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <style>
        .profile-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .profile-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
        }
        .profile-info {
            margin-top: 30px;
        }
        .profile-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<div class="container profile-container">
    <h1 class="text-center mb-4">밴드 사용자 프로필</h1>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div th:if="${profile}" class="card">
        <div class="card-body text-center">
            <img th:if="${profile.profile_image_url}" th:src="${profile.profile_image_url}" class="profile-image" alt="프로필 이미지">
            <img th:unless="${profile.profile_image_url}" src="/img/default-profile.png" class="profile-image" alt="기본 프로필 이미지">

            <div class="profile-name" th:text="${profile.name}">사용자 이름</div>

            <div class="profile-info">
                <table class="table table-striped">
                    <tbody>
                    <tr>
                        <th>사용자 ID</th>
                        <td th:text="${profile.user_key}">-</td>
                    </tr>
                    <tr>
                        <th>앱 멤버 여부</th>
                        <td>
                            <span th:if="${profile.is_app_member}" class="badge bg-success">연동됨</span>
                            <span th:unless="${profile.is_app_member}" class="badge bg-secondary">연동 안됨</span>
                        </td>
                    </tr>
                    <tr>
                        <th>메시지 수신 허용</th>
                        <td>
                            <span th:if="${profile.message_allowed}" class="badge bg-primary">허용</span>
                            <span th:unless="${profile.message_allowed}" class="badge bg-warning text-dark">비허용</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <a href="/band/dashboard" class="btn btn-primary mt-3">대시보드로 돌아가기</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
