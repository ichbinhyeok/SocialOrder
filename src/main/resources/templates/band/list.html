<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>내 밴드 목록</title>
    <style>
        .band-card {
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .band-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .band-cover {
            height: 180px;
            object-fit: cover;
        }
        .card-actions {
            display: flex;
            gap: 0.5rem;
        }
        .band-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            color: #6c757d;
            font-size: 0.9rem;
        }
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            border-radius: 0.5rem;
            background-color: #f8f9fa;
            border: 1px dashed #dee2e6;
        }
        .empty-state i {
            font-size: 3rem;
            color: #adb5bd;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <!-- 페이지 헤더 및 액션 버튼 -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-0">내 밴드 목록</h1>
            <p class="text-muted">관리 중인 밴드 목록을 확인하세요</p>
        </div>
        <div>
            <a href="/band/profile/show" class="btn btn-outline-primary me-2">
                <i class="bi bi-person"></i> 내 프로필
            </a>
            <a href="#" class="btn btn-primary">
                <i class="bi bi-plus"></i> 새 밴드 추가
            </a>
        </div>
    </div>

    <!-- 알림 메시지 -->
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${message}">성공 메시지</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- 에러 메시지 -->
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${error}">에러 메시지</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- 밴드 통계 요약 -->
    <div class="card mb-4" th:if="${bandList != null && !bandList.isEmpty()}">
        <div class="card-body">
            <div class="row g-0">
                <div class="col-md-4 text-center border-end">
                    <h5 class="mb-1" th:text="${#lists.size(bandList)}">0</h5>
                    <p class="text-muted mb-0">총 밴드 수</p>
                </div>
                <div class="col-md-4 text-center border-end">
                    <h5 class="mb-1">0</h5>
                    <p class="text-muted mb-0">오늘 새 글</p>
                </div>
                <div class="col-md-4 text-center">
                    <h5 class="mb-1">0</h5>
                    <p class="text-muted mb-0">처리 대기 주문</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 밴드 목록 컨테이너 -->
    <div class="row g-4">
        <!-- 빈 상태 표시 -->
        <div th:if="${bandList == null || bandList.isEmpty()}" class="col-12">
            <div class="empty-state">
                <i class="bi bi-people"></i>
                <h4>밴드가 없습니다</h4>
                <p class="text-muted">아직 가입한 밴드가 없습니다. 밴드 API를 통해 밴드를 추가해 보세요.</p>
                <a href="/oauth/login" class="btn btn-primary mt-2">
                    <i class="bi bi-plus-circle"></i> 밴드 연결하기
                </a>
            </div>
        </div>

        <!-- 밴드 카드 목록 -->
        <div th:each="band : ${bandList}" class="col-md-6 col-lg-4">
            <div class="card h-100 band-card">
                <!-- 밴드 커버 이미지 -->
                <div class="position-relative">
                    <img th:if="${band.cover}" th:src="${band.cover}" class="card-img-top band-cover" alt="밴드 커버">
                    <div th:unless="${band.cover}" class="card-img-top band-cover bg-light d-flex align-items-center justify-content-center">
                        <i class="bi bi-image text-muted" style="font-size: 3rem;"></i>
                    </div>
                    <div class="position-absolute top-0 end-0 m-2">
                            <span class="badge bg-primary rounded-pill">
                                <i class="bi bi-people-fill"></i>
                                <span th:text="${band.member_count}">0</span>
                            </span>
                    </div>
                </div>

                <!-- 카드 내용 -->
                <div class="card-body">
                    <h5 class="card-title" th:text="${band.name}">밴드 이름</h5>

                    <!-- 밴드 통계 -->
                    <div class="band-stats">
                            <span>
                                <i class="bi bi-chat-left-text"></i>
                                최근 글 0개
                            </span>
                        <span>
                                <i class="bi bi-cart"></i>
                                주문 0개
                            </span>
                    </div>

                    <!-- 액션 버튼 -->
                    <div class="card-actions">
                        <a th:href="@{/band/posts(band_key=${band.band_key})}" class="btn btn-outline-primary flex-grow-1">
                            <i class="bi bi-card-list"></i> 글 목록
                        </a>
                        <a th:href="@{/band/detail(band_key=${band.band_key})}" class="btn btn-outline-secondary flex-grow-1">
                            <i class="bi bi-info-circle"></i> 상세
                        </a>
                    </div>
                </div>

                <!-- 카드 푸터 -->
                <div class="card-footer bg-transparent">
                    <small class="text-muted">
                        <i class="bi bi-key"></i>
                        밴드 키: <span th:text="${#strings.substring(band.band_key, 0, 10) + '...'}"></span>
                    </small>
                </div>
            </div>
        </div>
    </div>

    <!-- 페이지 네비게이션 (필요한 경우) -->
    <nav th:if="${bandList != null && !bandList.isEmpty() && bandList.size() > 9}" class="my-4">
        <ul class="pagination justify-content-center">
            <li class="page-item disabled">
                <a class="page-link" href="#" tabindex="-1" aria-disabled="true">이전</a>
            </li>
            <li class="page-item active"><a class="page-link" href="#">1</a></li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#">3</a></li>
            <li class="page-item">
                <a class="page-link" href="#">다음</a>
            </li>
        </ul>
    </nav>

    <!-- 스크롤 상단 버튼 -->
    <button id="backToTop" class="btn btn-primary btn-sm position-fixed bottom-0 end-0 m-4" style="display: none;">
        <i class="bi bi-arrow-up"></i>
    </button>
</div>

<!-- 페이지별 스크립트 -->
<th:block layout:fragment="script">
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 스크롤 상단 버튼 표시/숨김 처리
            const backToTopBtn = document.getElementById('backToTop');

            window.addEventListener('scroll', function() {
                if (window.scrollY > 300) {
                    backToTopBtn.style.display = 'block';
                } else {
                    backToTopBtn.style.display = 'none';
                }
            });

            backToTopBtn.addEventListener('click', function() {
                window.scrollTo({top: 0, behavior: 'smooth'});
            });
        });
    </script>
</th:block>
</body>
</html>
